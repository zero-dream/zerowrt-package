# ! 本项目私有文件

# CI 项目
name: auto-update

# CI 权限
permissions: write-all

# CI 计划
on:
  # 自动运行: 每天 01:00
  schedule:
    - cron: 0 17 * * *
  # 手动运行
  workflow_dispatch:
    inputs:
      COMMIT:
        description: 'Commit Message'
        required: false
        type: string
        default: ''

# CI 环境
env:
  # GITHUB ENV
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  # CI ENV
  CI_COMMIT: ${{inputs.COMMIT || ''}} # 为自动编译设置默认值

# CI 任务
jobs:
  auto-update:
    name: auto-update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{secrets.WORKFLOW_TOKEN}}

      - name: InitWorkflow
        run: |
          workflowPath="$(mktemp -d "$RUNNER_TEMP/ZeroDream-Workflow-XXXXXX")"
          git clone --depth=1 https://github.com/zero-dream/github-action.git "$workflowPath/" || exit 1
          chmod +x "$workflowPath/zerodream/init/init.sh"
          bash "$workflowPath/zerodream/init/init.sh"
          rm -rf "$workflowPath/"

      - name: UpdateRepo
        run: |
          source "$ZD_ScriptPath/createPath.sh"
          source "$ZD_ScriptPath/updateRepo.sh"
          updatePath=$(cloneRepo)
          firmwareRepoPath="$(createTempPath 'Temp_FirmwareRepo:dir')"
          git clone --depth=1 "https://github.com/$ZD_Owner/zerowrt-firmware.git" "$firmwareRepoPath/"
          coverArr=(
            'auto-update'
            'clean-release'
          )
          for cover in "${coverArr[@]}"; do
            cp -a "$updatePath/.github/workflows/$cover.yml" "$firmwareRepoPath/.github/workflows/"
          done
          find "$updatePath/.github/workflows/" -mindepth 1 -delete
          cp -a "$firmwareRepoPath/.github/workflows/." "$updatePath/.github/workflows/"
          rm -rf "$firmwareRepoPath/"
          message="${CI_COMMIT:-$ZD_DateUTC}"
          pushRepo "$message"
